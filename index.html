<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Notes + To-Do</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Voice Notes + To-Do</h1>
        <p>Capture quick audio notes and turn ideas into action.</p>
      </header>

      <section class="card" aria-labelledby="todo-heading">
        <h2 id="todo-heading">To-Do List</h2>
        <form id="todo-form" class="row">
          <input id="todo-input" type="text" placeholder="Add a task..." maxlength="140" required />
          <button type="submit">Add</button>
        </form>
        <ul id="todo-list" class="list" aria-live="polite"></ul>
      </section>

      <section class="card" aria-labelledby="voice-heading">
        <h2 id="voice-heading">Voice Notes</h2>
        <div class="row controls">
          <button id="record-btn" type="button">Start Recording</button>
          <span id="recording-status" aria-live="polite">Idle</span>
        </div>
        <p class="hint">Uses your browser microphone permission. Recordings stay on this device.</p>
        <div id="voice-list" class="voice-list" aria-live="polite"></div>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input class="todo-checkbox" type="checkbox" />
          <span class="todo-text"></span>
        </label>
        <button class="danger" type="button">Delete</button>
      </li>
    </template>

    <template id="voice-item-template">
      <article class="voice-item">
        <p class="voice-title"></p>
        <audio controls></audio>
        <button class="danger" type="button">Delete</button>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
